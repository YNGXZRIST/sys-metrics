<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e4e4e4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .section-title {
            font-size: 1.25rem;
            color: #4fc3f7;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4fc3f7;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .metric-card {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .metric-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        .metric-name {
            font-size: 0.9rem;
            color: #b0b0b0;
            word-break: break-all;
        }
        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #81c784;
            font-family: 'Monaco', 'Consolas', monospace;
        }
        .counter .metric-value {
            color: #ffb74d;
        }
        .empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Metrics Dashboard</h1>

        <div class="section">
            <h2 class="section-title">Gauge</h2>
            <div class="metrics-grid">
                {{range $key, $value := .Gauge}}
                <div class="metric-card">
                    <span class="metric-name">{{$key}}</span>
                    <span class="metric-value">{{$value.Value}}</span>
                </div>
                {{else}}
                <p class="empty">No gauge metrics</p>
                {{end}}
            </div>
        </div>

        <div class="section counter">
            <h2 class="section-title">Counter</h2>
            <div class="metrics-grid">
                {{range $key, $value := .Counter}}
                <div class="metric-card">
                    <span class="metric-name">{{$key}}</span>
                    <span class="metric-value">{{$value.Delta}}</span>
                </div>
                {{else}}
                <p class="empty">No counter metrics</p>
                {{end}}
            </div>
        </div>
    </div>
</body>
</html>
